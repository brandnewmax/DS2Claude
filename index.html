<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS2Claude — 模型组管理</title>
<style>
  :root {
    --bg: #f5f5f7;
    --sidebar-bg: #ebebf0;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
    --accent-hover: #0064cc;
    --danger: #ff3b30;
    --danger-hover: #e0352b;
    --active-dot: #34c759;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 280px 1fr; height: 100vh;
  }

  /* ── 侧边栏 ─────────────────────────────── */
  .sidebar {
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 20px 16px;
    gap: 12px;
  }
  .sidebar h1 {
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
  }
  .sidebar h1 span { color: var(--text-secondary); font-weight: 400; }

  .group-list {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    margin: 0 -4px;
    padding: 4px;
  }

  .group-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background .15s;
    border: 2px solid transparent;
  }
  .group-item:hover { background: rgba(0,0,0,.04); }
  .group-item.selected { background: var(--card-bg); border-color: var(--accent); box-shadow: var(--shadow); }
  .group-item .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border); flex-shrink: 0;
  }
  .group-item .dot.active { background: var(--active-dot); }
  .group-item .info { flex:1; min-width:0; }
  .group-item .info .name { font-weight: 600; font-size: 14px; }
  .group-item .info .label { font-size: 12px; color: var(--text-secondary); margin-top: 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group-item .active-badge {
    font-size: 10px; font-weight: 600;
    background: var(--active-dot); color: #fff;
    padding: 2px 6px; border-radius: 20px;
    flex-shrink: 0;
    opacity: 0;
  }
  .group-item .active-badge.show { opacity: 1; }

  .sidebar-btns { display:flex; gap:8px; }
  .sidebar-btns button { flex:1; }

  /* ── 主区域 ─────────────────────────────── */
  .main {
    padding: 24px 32px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 20px;
  }
  .main-header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .main-header h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }

  .status-bar {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: var(--text-secondary);
  }
  .status-bar .pill {
    padding: 4px 12px; border-radius: 20px;
    background: var(--card-bg); border: 1px solid var(--border);
    font-weight: 500;
  }
  .status-bar .pill.green { border-color: var(--active-dot); color: var(--active-dot); }

  /* ── 映射表 ─────────────────────────────── */
  .mapping-table {
    width: 100%;
    border-collapse: separate; border-spacing: 0 6px;
  }
  .mapping-table th {
    text-align: left; font-size: 11px; font-weight: 600;
    color: var(--text-secondary); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 0 12px 4px;
  }
  .mapping-table td { padding: 10px 12px; }
  .mapping-table td input {
    width: 100%; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 13px; font-family: "SF Mono", "Fira Code", monospace;
    background: var(--card-bg);
    transition: border-color .15s;
  }
  .mapping-table td input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,113,227,.12);
  }
  .mapping-table tbody tr { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); }
  .mapping-table tbody tr td:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .mapping-table tbody tr td:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .col-source { width: 22%; }
  .col-target { width: 22%; }
  .col-base   { width: 30%; }
  .col-key    { width: 20%; }
  .col-del    { width: 6%; text-align: center; }

  /* ── 按钮 ─────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    padding: 7px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 500; font-family: inherit;
    border: none; cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-outline { background: var(--card-bg); color: var(--accent); border: 1px solid var(--accent); }
  .btn-outline:hover { background: #f0f4ff; }
  .btn-danger { background: none; color: var(--danger); }
  .btn-danger:hover { background: rgba(255,59,48,.08); }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-icon { width: 28px; height: 28px; padding: 0; border-radius: 6px; font-size: 16px; }

  /* ── 空状态 ─────────────────────────────── */
  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--text-secondary);
  }
  .empty-state p { margin-bottom: 12px; font-size: 15px; }

  /* ── Toast ─────────────────────────────── */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: #1d1d1f; color: #fff;
    padding: 10px 20px; border-radius: 8px;
    font-size: 14px; font-weight: 500;
    animation: toast-in .3s ease;
    z-index: 100;
  }
  @keyframes toast-in { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
</style>
</head>
<body>

<!-- ═══════════ 侧边栏 ═══════════ -->
<aside class="sidebar">
  <h1>DS2<span>Claude</span></h1>

  <div class="group-list" id="groupList"></div>

  <div class="sidebar-btns">
    <button class="btn btn-primary" onclick="createGroup()">+ 新建组</button>
  </div>
</aside>

<!-- ═══════════ 主区域 ═══════════ -->
<main class="main" id="mainPanel">
  <div class="empty-state" id="emptyState">
    <p>选择一个组来编辑映射</p>
    <button class="btn btn-primary" onclick="createGroup()">创建第一个组</button>
  </div>
</main>

<!-- ═══════════ Toast ═══════════ -->
<div id="toastContainer"></div>

<script>
// ── 状态 ───────────────────────────────────────────
let state = { active: '', groups: {}, model_map: {} };
let selectedGroup = '';
let modified = false;

// ── API ────────────────────────────────────────────
const api = {
  async state() {
    const r = await fetch('/api/state');
    return r.json();
  },
  async createGroup(name, data) {
    const r = await fetch(`/api/groups/${encodeURIComponent(name)}`, {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.error); }
    return r.json();
  },
  async updateGroup(name, data) {
    const r = await fetch(`/api/groups/${encodeURIComponent(name)}`, {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    if (!r.ok) { const e = await r.json(); throw new Error(e.error); }
    return r.json();
  },
  async deleteGroup(name) {
    await fetch(`/api/groups/${encodeURIComponent(name)}`, { method:'DELETE' });
  },
  async activate(name) {
    const r = await fetch(`/api/activate/${encodeURIComponent(name)}`, { method:'POST' });
    return r.json();
  },
};

// ── Toast ──────────────────────────────────────────
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── 渲染侧边栏 ────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('groupList');
  const names = Object.keys(state.groups).sort();

  if (names.length === 0) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:13px;">暂无组，点击下方按钮创建</div>';
    return;
  }

  list.innerHTML = names.map(name => {
    const g = state.groups[name];
    const isActive = state.active === name;
    const sel = (selectedGroup || state.active) === name ? 'selected' : '';

    return `
      <div class="group-item ${sel}" onclick="selectGroup('${escapeHtml(name)}')">
        <div class="dot ${isActive ? 'active' : ''}"></div>
        <div class="info">
          <div class="name">${escapeHtml(name)}</div>
          <div class="label">${escapeHtml(g.label || '')}</div>
        </div>
        <div class="active-badge ${isActive ? 'show' : ''}">当前</div>
      </div>
    `;
  }).join('');
}

// ── 渲染映射表 ────────────────────────────────────
function renderMappings(groupName) {
  const main = document.getElementById('mainPanel');
  const group = state.groups[groupName];
  if (!group) return;

  const isActive = state.active === groupName;
  const mappings = group.mappings || [];

  main.innerHTML = `
    <div class="main-header">
      <h2>${escapeHtml(groupName)} — ${escapeHtml(group.label || '')}</h2>
      <div class="status-bar">
        <span class="pill ${isActive ? 'green' : ''}">${isActive ? '● 当前生效中' : '○ 未激活'}</span>
        ${!isActive ? `<button class="btn btn-outline btn-sm" onclick="activateGroup('${escapeHtml(groupName)}')">启用此组</button>` : ''}
        <button class="btn btn-danger btn-sm" onclick="deleteGroup('${escapeHtml(groupName)}')">删除组</button>
      </div>
    </div>

    <table class="mapping-table">
      <thead>
        <tr>
          <th class="col-source">源模型名 <small>(Claude Desktop 中显示)</small></th>
          <th class="col-target">目标模型</th>
          <th class="col-base">API Base URL</th>
          <th class="col-key">API Key</th>
          <th class="col-del"></th>
        </tr>
      </thead>
      <tbody id="mappingBody"></tbody>
    </table>
    <div>
      <button class="btn btn-outline" onclick="addMapping('${escapeHtml(groupName)}')">+ 添加映射</button>
      ${modified ? '<span style="margin-left:12px;font-size:13px;color:var(--text-secondary);">有未保存的修改</span>' : ''}
    </div>
    <div style="margin-top: 8px;">
      <button class="btn btn-primary" onclick="saveGroup('${escapeHtml(groupName)}')">保存</button>
    </div>
  `;

  // 渲染映射行
  const tbody = document.getElementById('mappingBody');
  tbody.innerHTML = mappings.map((m, i) => `
    <tr>
      <td><input value="${escapeHtml(m.source || '')}" onchange="onMappingChange(${i},'source',this.value)" placeholder="claude-opus-4-7"></td>
      <td><input value="${escapeHtml(m.target?.model || '')}" onchange="onMappingChange(${i},'targetModel',this.value)" placeholder="deepseek-chat"></td>
      <td><input value="${escapeHtml(m.target?.api_base || '')}" onchange="onMappingChange(${i},'targetBase',this.value)" placeholder="https://api.deepseek.com/v1"></td>
      <td><input value="${escapeHtml(m.target?.api_key || '')}" onchange="onMappingChange(${i},'targetKey',this.value)" placeholder="sk-..."></td>
      <td><button class="btn btn-danger btn-icon" onclick="removeMapping('${escapeHtml(groupName)}',${i})" title="删除">×</button></td>
    </tr>
  `).join('');

  document.getElementById('emptyState')?.remove();
}

// ── 映射变更跟踪 ──────────────────────────────────
function onMappingChange(idx, field, value) {
  const group = state.groups[selectedGroup];
  if (!group || !group.mappings[idx]) return;
  if (field === 'source') {
    group.mappings[idx].source = value;
  } else if (field === 'targetModel') {
    group.mappings[idx].target.model = value;
  } else if (field === 'targetBase') {
    group.mappings[idx].target.api_base = value;
  } else if (field === 'targetKey') {
    group.mappings[idx].target.api_key = value;
  }
  modified = true;
}

function addMapping(groupName) {
  state.groups[groupName].mappings.push({
    source: '',
    target: { model: '', api_base: '', api_key: '' },
  });
  modified = true;
  renderMappings(groupName);
  toast('已添加新映射行，记得保存');
}

function removeMapping(groupName, idx) {
  state.groups[groupName].mappings.splice(idx, 1);
  modified = true;
  renderMappings(groupName);
}

// ── 组操作 ────────────────────────────────────────
function selectGroup(name) {
  if (modified) {
    if (!confirm('有未保存的修改，确定放弃并切换？')) return;
  }
  modified = false;
  selectedGroup = name;
  renderSidebar();
  renderMappings(name);
}

async function saveGroup(name) {
  try {
    await api.updateGroup(name, state.groups[name]);
    modified = false;
    toast('已保存');
    // 如果改的是当前激活组，映射立即生效
    if (state.active === name) {
      const s = await api.state();
      state = s;
    }
    renderMappings(name);
    renderSidebar();
  } catch (e) {
    toast('保存失败: ' + e.message);
  }
}

async function activateGroup(name) {
  try {
    const r = await api.activate(name);
    state.active = name;
    state.model_map = r.model_map;
    modified = false;
    selectedGroup = name;
    renderSidebar();
    renderMappings(name);
    toast(`已切换到「${name}」，映射已生效`);
  } catch (e) {
    toast('切换失败: ' + e.message);
  }
}

async function createGroup() {
  const name = prompt('输入新组名称（英文，如 kimi / gpt55）：');
  if (!name || !name.trim()) return;
  const label = prompt('输入显示标签（中文名，如 "Kimi K2"）：') || name;
  try {
    await api.createGroup(name.trim(), {
      label: label.trim(),
      mappings: [
        { source: 'claude-opus-4-7',  target: { model: '', api_base: '', api_key: '' } },
        { source: 'claude-sonnet-4-6', target: { model: '', api_base: '', api_key: '' } },
        { source: 'claude-haiku-4-5', target: { model: '', api_base: '', api_key: '' } },
      ],
    });
    const s = await api.state();
    state = s;
    modified = false;
    selectedGroup = name.trim();
    if (!state.active) {
      // 第一个组自动激活
      await api.activate(name.trim());
      state.active = name.trim();
    }
    renderSidebar();
    renderMappings(selectedGroup);
    toast(`组「${name.trim()}」已创建`);
  } catch (e) {
    toast('创建失败: ' + e.message);
  }
}

async function deleteGroup(name) {
  if (!confirm(`确定删除组「${name}」？此操作不可恢复。`)) return;
  try {
    await api.deleteGroup(name);
    const s = await api.state();
    state = s;
    modified = false;
    selectedGroup = state.active || Object.keys(state.groups)[0] || '';
    renderSidebar();
    if (selectedGroup) {
      renderMappings(selectedGroup);
    } else {
      document.getElementById('mainPanel').innerHTML = `
        <div class="empty-state" id="emptyState">
          <p>还没有组</p>
          <button class="btn btn-primary" onclick="createGroup()">创建第一个组</button>
        </div>
      `;
    }
    toast(`组「${name}」已删除`);
  } catch (e) {
    toast('删除失败: ' + e.message);
  }
}

// ── 工具函数 ──────────────────────────────────────
function escapeHtml(s) {
  if (!s) return '';
  s = String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── 启动 ──────────────────────────────────────────
(async function init() {
  try {
    state = await api.state();
    selectedGroup = state.active || Object.keys(state.groups)[0] || '';
    renderSidebar();
    if (selectedGroup) {
      renderMappings(selectedGroup);
    }
  } catch (e) {
    document.getElementById('groupList').innerHTML = '<div style="color:var(--danger);padding:20px;">无法连接服务</div>';
  }
})();
</script>
</body>
</html>
